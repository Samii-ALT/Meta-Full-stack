<!doctype html>
<html>
  <head>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container">

      <!-- Main row: 2 columns -->
      <div class="row">

        <!-- LEFT COLUMN: DISHES -->
        <div class="col-12 col-lg-6">

          <h1>Our Menu</h1>

          <!-- Nested row for dishes -->
          <div class="row">

            <!-- Dish 1 -->
            <div class="col-12 col-md-6 mb-3">
              <div class="card">
                <img
                  src="Calamari.jpg"
                  class="card-img-top"
                  alt="Calamari"
                />

                <div class="card-body">
                  <h2>
                    Calamari
                    <span class="badge bg-primary">New</span>
                  </h2>

                  <p>Squid, Buttermilk.</p>
                </div>
              </div>
            </div>

            <!-- Dish 2 -->
            <div class="col-12 col-md-6 mb-3">
              <div class="card">
                <img
                  src="Falafel.jpg"
                  class="card-img-top"
                  alt="Falafel"
                />

                <div class="card-body">
                  <h2>Falafel</h2>

                  <p>Chickpea, herbs and spices.</p>
                </div>
              </div>
            </div>

            <!-- Dish 3 -->
            <div class="col-12 col-md-6 mb-3">
              <div class="card">
                <img
                  src="Pasta.jpg"
                  class="card-img-top"
                  alt="Pasta"
                />

                <div class="card-body">
                  <h2>Pasta</h2>

                  <p>Lettuce, vegetables and mozzarella.</p>
                </div>
              </div>
            </div>

            <!-- You can add more dishes here -->

          </div>
        </div>


        <!-- RIGHT COLUMN: PRICES -->
        <div class="col-12 col-lg-6">

          <h2>Prices</h2>

          <table class="table">
            <tr>
              <td>Falafel</td>
              <td>10.00$</td>
            </tr>

            <tr>
              <td>Pasta Salad</td>
              <td>12.00$</td>
            </tr>

            <tr>
              <td>Calamari</td>
              <td>12.00$</td>
            </tr>
          </table>
          <div class="alert alert-info" role:"alert">
            <p>Try our new dish Calamari</p>
          </div>
        </div>

      </div>

    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js">
    </script>
  </body>
</html>
