<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KEY</title>
    <style>
        .box{
            width: 100px;
            height: 100px;
            margin: 120px;
            background-color: aqua;
        }
        .box:hover{
            animation: grow 1s infinite;
        }
        @keyframes grow{
            0% {
                width: 100px;
                height: 100px;
            }
            50% {
                width: 300px;
                height: 300px;
            }
            100%{
                width: 200px;
                height: 200px;
            }
            
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
