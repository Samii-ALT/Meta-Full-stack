<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            display: grid;
            height: 240px;
            width: 240px;
            margin: 170px;
            background-color: palegreen;
            border: 2px solid rgb(17, 167, 17);
            border-radius: 12px;
        }
        .box:hover{
            transform: rotateZ(60deg);
            background-color: rgb(139, 3, 103);
            opacity: 30%;
            transition: 2s;
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
