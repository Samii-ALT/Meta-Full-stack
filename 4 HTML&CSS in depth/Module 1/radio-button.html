<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Little lemon</title>
</head>
<body>
    <main>
        <h2>Booking Table</h2>
        <fieldset id="number">
            <label>
                <input type="radio" name="number" value="2"> 2 persons table
            </label>
            <label>
                <input type="radio" name="number" value="4" checked> 4 persons table
            </label>
            <label>
                <input type="radio" name="number" value="6"> 6 persons table
            </label>
        </fieldset>
        <fieldset id="position">
            <label>
                <input type="radio" name="position" value="indoor" checked> Indoors
            </label>
            <label>
                <input type="radio" name="position" value="outdoor"> Outdoors
            </label>
        </fieldset>
    </main>
    
</body>
</html>
