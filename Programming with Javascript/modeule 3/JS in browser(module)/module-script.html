<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module Script</title>
</head>
<body>
    <h4>This is a Module Script</h4>
    <script type="module">
        import {informalGreeting} from './greeting.js';
        informalGreeting("Sami");
    </script>
    <script type="module">
        import { informalGreeting, formalGreeting } from './greeting.js';
        import greeting from './greeting.js';
        formalGreeting("Sami");
        greeting();
    </script>
</body>
</html>
